# Fetches what requests.txt asks for, on GitHub's own machines, and saves it here (Time Kings' assets).
name: fetch
on:
  push:
    paths: [requests.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch.py
      - run: |
          git config user.name "timekings-fetch"
          git config user.email "timekings-fetch@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fetched: $(tail -n 1 fetched.log)"
          git push
